      // Funzione per generare il link immagine corretto
      function getCardImageUrl(id) {
        // Se hai rinominato gli ID in swac, swpa, ecc...
        // Il link ora sarà semplicemente diretto
        return `https://www.sacred-texts.com/tarot/pkt/img/${id}.jpg`;
      }

      function displayCards(cards) {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '';
        cards.forEach(card => {
          const div = document.createElement('div');
          div.className = 'card-item';
          div.onclick = () => openModal(card);
          const imgUrl = getCardImageUrl(card.id);
          div.innerHTML = `
            
												<img src="${imgUrl}" 
                 alt="${card.name}" 
                 onerror="this.onerror=null;this.src='https://upload.wikimedia.org/wikipedia/commons/d/db/Tarot_back.jpg';">
													<div class="card-label">${card.name}</div>
        `;
          grid.appendChild(div);
        });
      }

      function openModal(card) {
        const modalImg = document.getElementById('modalImg');
        const imgUrl = getCardImageUrl(card.id);
        // Reset immagine e caricamento
        modalImg.src = imgUrl;
        modalImg.onerror = function() {
          this.src = 'https://upload.wikimedia.org/wikipedia/commons/d/db/Tarot_back.jpg'; // Dorso della carta se il link è rotto
        };
        document.getElementById('modalTitle').innerText = card.name;
        document.getElementById('uprightText').innerText = card.up;
        document.getElementById('reversedText').innerText = card.rev;
        document.getElementById('adviceText').innerText = card.advice;
        document.getElementById('cardModal').style.display = 'flex';
      }

      function closeModal() {
        document.getElementById('cardModal').style.display = 'none';
      }

      function filterCategory(cat) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
        if (cat === 'all') {
          displayCards(tarotDeck);
        } else {
          const filtered = tarotDeck.filter(c => {
            if (cat === 'major') return c.id.startsWith('ar');
            if (cat === 'swords') return c.id.startsWith('sw');
            if (cat === 'cups') return c.id.startsWith('cu');
            if (cat === 'wands') return c.id.startsWith('wa');
            if (cat === 'pentacles') return c.id.startsWith('pe');
          });
          displayCards(filtered);
        }
      }
      // Inizializzazione
      displayCards(tarotDeck);
    </script>
